services:
  mongodb:
    image: mongo:7
    volumes:
      - mongo-data:/data/db
    # Not exposed to host — only reachable inside the compose network

  redis:
    image: redis:7-alpine

  server:
    build: ./server
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - NODE_ENV=production
      - MONGO_URI=mongodb://mongodb:27017/fileshare
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - JWT_SECRET=${JWT_SECRET}
      - CLIENT_URL=${CLIENT_URL:-http://localhost:3000}
      - CLOUDINARY_CLOUD_NAME=${CLOUDINARY_CLOUD_NAME}
      - CLOUDINARY_KEY=${CLOUDINARY_KEY}
      - CLOUDINARY_SECRET=${CLOUDINARY_SECRET}
      - EMAIL_USER=${EMAIL_USER}
      - EMAIL_PASS=${EMAIL_PASS}
    depends_on:
      - mongodb
      - redis

  client:
    build:
      context: ./client
      args:
        VITE_BACKEND_URL: ${VITE_BACKEND_URL:-http://localhost:5000/api}
    ports:
      - "3000:80"
    depends_on:
      - server

volumes:
  mongo-data:
